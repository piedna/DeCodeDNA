name: decod-e-dna
channels:
  - defaults
  - bioconda
  - conda-forge

dependencies:
  # core languages
  - python=3.9
  - pip

  # sequencing & filtering
  - cutadapt=4.8
  - seqkit=0.16.3
  - pod5=0.6.*           # FAST5⇄POD5 converter
  - nanofilt=2.8.0

  # clustering & OTU/ASV handling
  - vsearch=2.21.0
  - cd-hit=4.8.1
  - amplicon_sorter    # via Bioconda if available; else pip below

  # taxonomic classification
  - kraken2=2.1.2
  - bracken=2.7
  - blast=2.15.0

  # LCA & visualization
  - taxonkit=0.10.1
  - krona=2.7.1

  # R & denoising
  - r-base=4.2
  - r-tidyverse
  - r-lulu=0.1.0

  # pip installs
  - pip:
    - pod5>=0.6
    - git+https://github.com/avierstr/amplicon_sorter.git@main