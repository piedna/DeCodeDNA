name: Docker image

on:
  pull_request:
    paths: ["docker/**", "scripts/**", "gui/**", "launchers/**", ".dockerignore", ".github/workflows/docker.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/decodedna

jobs:
  # Fast check on every PR / main push: build amd64, check the tools, run QC on mock data.
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: decodedna:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tools check (databases are expected to be missing)
        run: |
          set +e
          docker run --rm decodedna:test check
          code=$?
          # 0 = ready, 3 = tools OK but no databases mounted; anything else is a failure
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ]
      - name: Script 02 refuses to run without databases
        run: |
          ! docker run --rm decodedna:test qc /opt/decodedna/workflows/ont_native_barcodes /tmp/out
      - name: GUI starts and answers
        run: |
          mkdir -p ws dbs
          docker run -d --name gui --user "$(id -u):$(id -g)" -p 127.0.0.1:8080:8080 \
            -v "$PWD/ws":/work -v "$PWD/dbs":/databases decodedna:test gui
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/api/state >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/ | grep -q "<title>DeCodeDNA</title>"
          curl -fs http://127.0.0.1:8080/api/check | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='databases_missing', d; assert all(c['ok'] for c in d['checks'] if c['group']=='tool'), d"
          # job API: browsing the bundled example works, cross-site POSTs are refused
          curl -fs "http://127.0.0.1:8080/api/browse?path=/opt/decodedna/workflows/ont_native_barcodes" | python3 -c "import json,sys; assert json.load(sys.stdin)['seq_files']==3"
          test "$(curl -s -o /dev/null -w '%{http_code}' -d '{}' http://127.0.0.1:8080/api/jobs)" = 403
          docker logs gui
          docker rm -f gui

  # The Windows launcher cannot be run in CI (no Docker Desktop), but it must at least parse.
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse launcher.ps1
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw launchers\lib\launcher.ps1), [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }
          Write-Host "launcher.ps1 parses OK"

  # Multi-arch release image on version tags (v0.2.0 → :0.2.0 and :latest)
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke-test, windows-launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Double-click launchers for the GitHub release page (v* tags)
  launchers:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build DeCodeDNA-launchers.zip
        run: |
          mkdir -p dist/DeCodeDNA
          cp -R launchers/. dist/DeCodeDNA/
          chmod +x dist/DeCodeDNA/DeCodeDNA.command dist/DeCodeDNA/DeCodeDNA.sh dist/DeCodeDNA/lib/launcher.sh
          (cd dist && zip -r -X DeCodeDNA-launchers.zip DeCodeDNA)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/DeCodeDNA-launchers.zip
